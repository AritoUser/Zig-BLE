name: Zig-BLE CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Native Build, Unit Tests & Fuzz Smoke Suite (Linux, Windows & macOS)
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run Unit & Integration Test Suite (mock backend, no radio)
        run: zig build test --summary all

      - name: Run Mock End-to-End Smoke Test (no radio)
        run: zig build run-mock-e2e

      - name: Run Advertising Fuzzing Suite (50,000 iterations)
        run: zig build fuzz -- 50000

      - name: Run Pure-Zig D-Bus Wire Fuzzing Suite (50,000 iterations)
        run: zig build fuzz-dbus -- 50000

      - name: Run Microbenchmark Suite
        if: runner.os == 'Linux'
        run: zig build bench

      - name: Generate HTML Documentation
        if: runner.os == 'Linux'
        run: zig build docs

  # ---------------------------------------------------------------------------
  # 2. Cross-Compilation Matrix (Zero-Sysroot Pure Zig Verification)
  # ---------------------------------------------------------------------------
  cross-compile:
    name: Cross-Compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - x86_64-windows-msvc
          - aarch64-macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cross-Compile Library & CLI Executables
        run: zig build -Dtarget=${{ matrix.target }}
