name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-linux:
    name: Linux Native (Pure Zig 0.16.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        run: |
          curl -sLO https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf zig-x86_64-linux-0.16.0.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH

      - name: Verify Zig Version
        run: zig version

      - name: Run Unit Tests
        run: zig build test --summary all

      - name: Run Fuzz Testing (50,000 iterations)
        run: |
          zig build fuzz -- 50000
          zig build fuzz-dbus -- 50000

      - name: Pure Zig Cross-Compilation (aarch64-linux without Sysroot)
        run: zig build -Dtarget=aarch64-linux

      - name: Build All Targets & Benchmarks
        run: |
          zig build
          zig build run-bench

      - name: Generate API Documentation
        run: zig build docs

  test-cross-platform:
    name: Cross-Platform Core Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0 (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sLO https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
          tar -xf zig-aarch64-macos-0.16.0.tar.xz
          echo "$PWD/zig-aarch64-macos-0.16.0" >> $GITHUB_PATH

      - name: Setup Zig 0.16.0 (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile "zig.zip"
          Expand-Archive -Path "zig.zip" -DestinationPath "."
          $zigPath = (Resolve-Path "zig-x86_64-windows-0.16.0").Path
          "$zigPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Zig Version
        run: zig version

      - name: Test Core Library
        run: zig build test --summary all
